# @spinejit/dsh-spinejit bundle patch. Spine owns the model context, so the
# plugins that rewrite it are switched off, then the spinejit row is added.
- id: compaction-basic
  disabled: true

# /compact follows the compaction service switched off above.
- id: command-compact
  disabled: true

- id: tool-result-pruner
  disabled: true

# image-offload is left alone: its row only exists at the composition root, so a
# bundle patch (which applies inside a preset) cannot reach it and is rejected.

- insert:
    - id: spinejit
      name: '@spinejit/dsh-spinejit'
