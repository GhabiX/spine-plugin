# @spinejit/dsh-spinejit bundle patch. Spine owns message placement, so
# disable plugins that replace or remove source messages. DSH image offload
# can still mark image occurrences in place when a route exceeds its budget.
- id: compaction-basic
  disabled: true

# /compact follows the compaction service switched off above.
- id: command-compact
  disabled: true

- id: tool-result-pruner
  disabled: true

- insert:
    - id: spinejit
      name: '@spinejit/dsh-spinejit'
