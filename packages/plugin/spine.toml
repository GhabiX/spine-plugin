# Pi-owned SpineConfig. The Pi extension passes this file as configToml.
# This owns Pi's JIT/node text and tool descriptions. Tool names are Pi names.
# Editing it does not require a WASM rebuild. Hosts that omit configToml
# still use the spine-core embedded default.
schema_version = 1

[prompt]
jit = '''<spine_instruction>
All substantive work MUST take place within explicit SpineBranches.

Use recursive calls: each branch owns one outcome. Work toward that outcome there, including synthesis and routine checks. Open a direct child for a distinct unresolved subproblem needed for that outcome, and apply the same rule inside it.

The active branch is the innermost unclosed <spine_node>. spine_open enters its child. spine_close returns exactly one level. spine_next returns one level and enters a sibling under that parent. <spine_memory> carries a returned result. Runtime replaces completed local history with that memory.

When the local outcome is complete or cancelled, close the branch with its result. Continue in the parent; if its outcome is also complete, close it too. For new work, first reach the branch whose goal directly needs it, then open its child. Use spine_next only when that owner is your immediate parent. State the intended outcome in each goal.

Work may span user turns. Apply corrections and cancellations immediately. Revisit completed work for new evidence, changed requirements, or a specific gap. Preserve unresolved obligations without claiming success.

Memory adds what continuation needs beyond inherited context and retained child results: local findings, changed conclusions, synthesis, and remaining obligations. Preserve necessary evidence and referents.

Root coordinates; enter a branch before substantive work. Answer the user in any scope.

After ownership is settled, batch compatible ready work. When a transition is needed, co-issue ready work for its destination. Use at most one spine_open, spine_close, or spine_next per model response. Ordinary tools in that response belong to the destination scope; results needed to finish the old scope must already be known.

When multiple independent child scopes are identified, use spine_spawn when enabled; otherwise process them sequentially with spine_open and spine_next.
</spine_instruction>
'''
node = ""
spawn = ""
spawn_explicit_request_only = "**DO NOT USE** the MultiAgent collaboration tools to spawn sub-agents unless the user or applicable AGENTS.md/skill instructions **EXPLICITLY** ask for sub-agents, delegation, or parallel agent work. This restriction applies **ONLY** to the MultiAgent collaboration surface and does not restrict independently available tools such as spine_spawn."
spawn_proactive = "Proactive MultiAgent collaboration is active. Any earlier instruction requiring an explicit user request before using the MultiAgent collaboration tools **NO LONGER APPLIES**. **USE** those collaboration tools when parallel work would materially improve speed or quality. This policy does not govern independent tools such as spine_spawn. This mode **REMAINS ACTIVE** until a later multi-agent mode developer message changes it."

[tools.open]
description = "Enter a direct child for goal. Opening preserves context and leaves earlier work in its existing scope."

[tools.close]
description = "Finalize the local scope with memory and return to the immediate parent. Root cannot close."

[tools.next]
description = "Finalize the local scope with memory and enter another child of the same parent for goal. Root cannot next."

[tools.spawn]
description = "Fission the current work into two or more concurrent peer branches created from the current full history. Each branch receives a differentiated assignment and **MUST OWN** a semantically independent direction: either resolve a concrete uncertainty or produce an independently verifiable outcome, with an explicit scope, evidence boundary, and completion predicate. A branch may investigate, review, or implement directly and **MUST RETURN** one terminal final memory. **GIVE EVERY BRANCH** a concise summary that is unique within this spawn call; the runtime uses it as the branch's public identity. Every spine_spawn call uses one task-local shared blackboard directory. **BEFORE** calling spine_spawn, the parent **MUST** provision the directory and repeat the same `Shared blackboard: <path>` line in every task prompt so branches can coordinate, share useful findings, and reduce duplicated exploration. For exploration or review, **TREAT** inherited analytical conclusions as hypotheses to verify, refine, or falsify against primary evidence. The original continuation is **NOT SUSPENDED**: keep working on what does not depend on the branches. Each branch's terminal result arrives later as its own `<spine_arrival>` message, in completion order. A scope that started branches **CANNOT** close or next until every one of them has arrived. Call spine_spawn **AT MOST ONCE** in one model response; **PLACE EVERY CONCURRENT BRANCH** in that call's tasks array. Use spine_spawn **ONLY** when the current work has at least two substantial, self-contained, independently completable branches and concurrent execution would materially improve speed or result quality. Each branch **MUST** be able to complete with a bounded fallback rather than depending on another branch's result. For one bounded delegated subtask, incremental assistance, or work that benefits from ongoing parent supervision, **USE** the ordinary multi-agent spawn tool when available or continue locally. **DO NOT** spawn paraphrased branches over the same tightly coupled question unless they are deliberately assigned as independent replication or falsification. Branch workspace and external effects are non-transactional, so production-file writes **REQUIRE** disjoint ownership or one explicitly named integration owner."
