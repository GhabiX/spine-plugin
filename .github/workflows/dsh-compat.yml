name: DSH compatibility
on:
  pull_request:
    paths: ['packages/dsh/**', 'tsconfig.base.json', '.github/workflows/dsh-compat.yml']
  push:
    branches: [main, 'release/dsh-*']
    paths: ['packages/dsh/**', 'tsconfig.base.json', '.github/workflows/dsh-compat.yml']
jobs:
  host:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '25']
        dsh: ['0.2.1-rc.2', '0.2.2-rc.5']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install, check, build and test the actual host
        run: node packages/dsh/scripts/test-host-matrix.mjs "$RUNNER_TEMP/dsh-matrix" '${{ matrix.dsh }}'
