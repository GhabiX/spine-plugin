name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish (publish changed SDK/host versions first)
        required: true
        type: choice
        default: plugin
        options:
          - plugin
          - sdk
          - host

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Use npm with Trusted Publishing support
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build and test all packages
        run: npm test

      - name: Publish selected package
        working-directory: packages/${{ inputs.package }}
        run: npm stage publish . --access public
